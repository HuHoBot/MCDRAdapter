name: Build MCDR Plugin

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build.yml'
      - 'huhobot/**'
      - 'mcdreforged.plugin.json'
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'huhobot/**'
      - 'mcdreforged.plugin.json'

jobs:
  build:
    name: Build Plugin Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set package version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "PKG_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "PKG_VERSION=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          fi

      - name: Zip package
        run: zip -r "HuHoBot-MCDR-${{ env.PKG_VERSION }}.zip" . -x '.git/*' '.github/*'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: "HuHoBot-MCDR-${{ env.PKG_VERSION }}.zip"

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: artifacts

      - name: Prepare R2 upload
        run: |
          mkdir -p mcdr
          cp "artifacts/HuHoBot-MCDR-${{ github.ref_name }}.zip" mcdr/
          echo '{"latest":"${{ github.ref_name }}"}' > mcdr/latest.json

      - name: Upload to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: mcdr
          destination-dir: mcdr

      - name: Extract release info
        id: changelog
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}

          CHANGELOG_CONTENT=$(awk -v version="[v$VERSION]" '
            BEGIN {RS="## "; FS="\n"}
            $1 ~ version {
              sub(/\[.*\] - .*\n/, "")
              gsub(/`/, "\\`")
              gsub(/"/, "\\\"")
              print
              exit
            }
          ' CHANGELOG.md)

          EOF_MARKER=$(openssl rand -base64 12)
          echo "body<<$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Get timestamp
        id: get-time
        run: echo "TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: HuHoBot MCDR ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.body }}

            ### 构建信息
            - 构建时间: ${{ steps.get-time.outputs.TIME }}
            - 提交哈希: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          files: |
            artifacts/HuHoBot-MCDR-${{ github.ref_name }}.zip